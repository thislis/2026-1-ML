# MELD.Raw train/test 를 실제 foundation embedding extractor 로 처리해 여러 모델을 비교한다.
#
# Text:  google/embeddinggemma-300m      (type: text_embeddinggemma)
# Audio: facebook/wav2vec2-xls-r-300m   (type: audio_wav2vec2_xlsr)
#
# 실행 전 모델 다운로드/추론 의존성이 필요하다.
#   uv sync --extra text --extra audio
#   uv run meld-emotion compare --config configs/meld_embeddinggemma_wav2vec2_suite.yaml
#
# 최초 실행은 train/test 전체 발화에 대해 두 foundation model embedding 을 계산하므로 오래 걸린다.
# 현재 장비에서는 MPS 가 사용 가능하지 않아 device 는 cpu 로 둔다.
# test split 의 일부 MP4 는 실제 파일 길이가 1분을 넘어 Wav2Vec2 self-attention buffer 가
# 커지므로 60초 초과 media sample 은 text/audio 모두 학습·평가에서 제외한다.

name: meld_embeddinggemma_wav2vec2_models
metrics: [accuracy, macro_f1, weighted_f1]
robustness_metric: weighted_f1
output_path: outputs/meld_embeddinggemma_wav2vec2_models.json

base:
  train_split: train
  eval_split: test

  dataset:
    type: meld
    root: MELD.Raw
    csv_train: train/train_sent_emo.csv
    csv_dev: dev_sent_emo.csv
    csv_test: test_sent_emo.csv
    audio_subdir_train: train/train_splits
    audio_subdir_dev: dev_splits_complete
    audio_subdir_test: output_repeated_splits_test
    video_subdir_train: train/train_splits
    video_subdir_dev: dev_splits_complete
    video_subdir_test: output_repeated_splits_test

  media:
    audio_sample_rate: 16000
    video_max_frames: 32
    video_frame_size: [64, 64]
    # MELD.Raw train 에 PyAV 가 열 수 없는 깨진 MP4 1개가 있어, media 로딩 실패 샘플은
    # 학습/평가에서 제외한다.
    on_error: drop_sample
    # 실제 MP4 길이 기준 1분 초과 파일은 Wav2Vec2 buffer 용량 부족을 피하기 위해 제외한다.
    max_audio_seconds: 60.0
    # Wav2Vec2 convolution stack 최소 입력 길이(약 400 samples @ 16kHz)보다 짧은 구간도 제외한다.
    min_audio_seconds: 0.025

  extractors:
    - type: text_embeddinggemma
      model_name: google/embeddinggemma-300m
      output_dim: 768
      batch_size: 32
      normalize: true
      prompt_name: Classification
      device: mps
    - type: audio_wav2vec2_xlsr
      model_name: facebook/wav2vec2-xls-r-300m
      output_dim: 1024
      batch_size: 1
      sampling_rate: 16000
      chunk_seconds: 30.0
      normalize: true
      device: mps

  evaluation:
    metrics: [accuracy, macro_f1, weighted_f1, per_class_recall]
    confusion: true
    scenarios: [full, no_text, no_audio]

  explainers:
    - type: modality_ablation
      metric: weighted_f1

  cache:
    type: memory

  reporters: []

experiments:
  - name: early_centroid
    model:
      type: early
      base:
        type: centroid
        temperature: 1.0
      use_concepts: false

  - name: early_linear_regression
    model:
      type: early
      base:
        type: linear_regression
        alpha: 0.001
        fit_intercept: true
      use_concepts: false

  - name: early_logreg
    model:
      type: early
      base:
        type: logreg
        C: 1.0
        max_iter: 1000
      use_concepts: false

  - name: late_centroid
    model:
      type: late
      base:
        type: centroid
        temperature: 1.0
      combiner:
        type: mean

  - name: dialogue_rnn
    model:
      type: dialogue_rnn
      rnn_type: gru
      modality_encoder:
        proj_dim: 128
        hidden_dim: 128
        dropout: 0.2
      fusion:
        modality_dim: 128
        fusion_dim: 256
        dropout: 0.3
        use_gated_fusion: true
        use_interaction_features: true
      dialogue_context:
        speaker_emb_dim: 32
        hidden_dim: 256
        num_layers: 1
        dropout: 0.3
      memory_attention:
        enabled: true
        attn_dim: 256
        use_rope: false
        use_relative_distance_bias: true
        use_same_speaker_bias: true
        max_relative_distance: 32
      classifier:
        hidden_dim: 256
        dropout: 0.3
      training:
        lr: 0.0002
        weight_decay: 0.01
        gradient_clip_norm: 1.0
        batch_size: 8
        max_epochs: 100
        early_stopping_patience: 10
        validation_fraction: 0.1
        modality_dropout: 0.1
        seed: 0
        device: mps