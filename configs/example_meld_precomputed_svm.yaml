# MELD 팀이 제공한 precomputed feature pickle 로 실행하는 baseline.
#   uv run meld-emotion run --config configs/example_meld_precomputed_svm.yaml
name: meld_precomputed_early_svm
seed: 0
output_dir: outputs

dataset:
  type: meld
  metadata_path: MELD.Features.Models/features/data_emotion.p

extractors:
  - type: meld_precomputed
    path: MELD.Features.Models/features/text_glove_average_emotion.pkl
    modality: text
  - type: meld_precomputed
    path: MELD.Features.Models/features/audio_embeddings_feature_selection_emotion.pkl
    modality: audio

model:
  type: early
  base:
    type: svm
    C: 1.0
    kernel: rbf
  use_concepts: true

evaluation:
  metrics: [accuracy, macro_f1, weighted_f1, per_class_recall]
  confusion: true
  scenarios: [full, no_text, no_audio]

cache:
  type: memory

reporters:
  - type: console
  - type: json
    path: outputs/meld_precomputed_result.json
