# 실제 MELD 실험 템플릿. 남은 placeholder 경계는 `meld-emotion status` 로 확인한다.
# 구현 진행 상황: `uv run meld-emotion status`
#
# 교수님 피드백 반영:
#   - 베이스라인 명시: SVM (model.base.type=svm). LogReg 로 바꾸려면 type=logreg.
#   - Early/Late fusion 비교: model.type 을 early <-> late 로 교체.
name: meld_early_svm
seed: 0
output_dir: outputs

# 학습 시 modality dropout(제안서): 각 (샘플, 모달리티)를 확률 p 로 가려 강건성을 키운다.
dropout:
  drop_prob: 0.3
  seed: 0

dataset:
  type: meld           # MeldDatasetSource — data/MELD 의 *_sent_emo.csv 사용
  root: data/MELD

# raw MP4 는 필요한 스트림만 lazy-load 한다.
media:
  audio_sample_rate: 16000
  video_max_frames: 32
  video_frame_size: [64, 64]   # [height, width]

# 텍스트: 개념 + TF-IDF / 오디오: 개념 + MFCC / 비디오: 개념 + 시각 단서
extractors:
  - type: text_concepts
  - type: text_tfidf
    max_features: 5000
    ngram_max: 2
  - type: audio_concepts
  - type: audio_mfcc
    n_mfcc: 13
  - type: video_concepts
  - type: video_visual
    dim: 16

# Early fusion + SVM 베이스라인.
model:
  type: early
  base:
    type: svm
    C: 1.0
    kernel: rbf
  use_concepts: true

evaluation:
  metrics: [accuracy, macro_f1, weighted_f1, per_class_recall]
  confusion: true
  scenarios: [full, no_text, no_audio, no_video]

explainers:
  - type: modality_ablation
    metric: macro_f1
  - type: permutation
    metric: macro_f1
    n_repeats: 5
    top_k: 20
    kinds: [concept]   # 개념 특징만(기본). 임베딩 포함 시 [concept, embedding] — 고차원 TF-IDF 는 느림
  - type: counterfactual
    top_k: 5
    sample_limit: 20

cache:
  type: disk
  path: .feature_cache

reporters:
  - type: console
  - type: json
    path: outputs/meld_result.json
  - type: dashboard
    path: outputs/meld_dashboard.json
