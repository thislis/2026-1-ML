# 실제 MELD 실험 템플릿. 현재는 @unimplemented 경계(MELD I/O, SVM 학습)에서 멈춘다.
# 구현 진행 상황: `uv run meld-emotion status`
#
# 교수님 피드백 반영:
#   - 베이스라인 명시: SVM (model.base.type=svm). LogReg 로 바꾸려면 type=logreg.
#   - Early/Late fusion 비교: model.type 을 early <-> late 로 교체.
name: meld_early_svm
seed: 0
output_dir: outputs

dataset:
  type: meld           # MeldDatasetSource (미구현) — data/MELD 의 *_sent_emo.csv 사용
  root: data/MELD

# 텍스트: 개념 + TF-IDF / 오디오: 개념 + MFCC / 비디오: 개념 + 시각 단서
extractors:
  - type: text_concepts
  - type: text_tfidf
    max_features: 5000
    ngram_max: 2
  - type: audio_concepts
  - type: audio_mfcc
    n_mfcc: 13
  - type: video_concepts
  - type: video_visual
    dim: 16

# Early fusion + SVM 베이스라인 (SvmEstimator 미구현 — scikit-learn 래퍼 필요).
model:
  type: early
  base:
    type: svm
    C: 1.0
    kernel: rbf
  use_concepts: true

evaluation:
  metrics: [accuracy, macro_f1, weighted_f1, per_class_recall]
  confusion: true
  scenarios: [full, no_text, no_audio, no_video]

explainers:
  - type: modality_ablation
    metric: macro_f1
  - type: permutation
    metric: macro_f1
    n_repeats: 5
    top_k: 20
  - type: counterfactual
    top_k: 5
    sample_limit: 20

cache:
  type: disk
  path: .feature_cache

reporters:
  - type: console
  - type: json
    path: outputs/meld_result.json
  - type: dashboard
    path: outputs/meld_dashboard.json
