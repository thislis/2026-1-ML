name: meld_sequence_dialogue_rnn
train_split: train
eval_split: test

dataset:
  type: meld
  root: MELD.Raw
  csv_train: train/train_sent_emo.csv
  csv_dev: dev_sent_emo.csv
  csv_test: test_sent_emo.csv
  audio_subdir_train: train/train_splits
  audio_subdir_dev: dev_splits_complete
  audio_subdir_test: output_repeated_splits_test
  video_subdir_train: train/train_splits
  video_subdir_dev: dev_splits_complete
  video_subdir_test: output_repeated_splits_test

extractors:
  - type: text_token_embeddings
    model_name: bert-base-uncased
    max_tokens: 64
    output_dim: 768
  - type: audio_wav2vec2_xlsr_sequence
    model_name: facebook/wav2vec2-xls-r-300m
    max_steps: 128
    output_dim: 1024
    sampling_rate: 16000
  - type: video_frame_embeddings
    model_name: openai/clip-vit-base-patch32
    num_frames: 16
    output_dim: 768

model:
  type: dialogue_rnn
  modality_encoder:
    encoder_type: conformer
    text_input_dim: 768
    audio_input_dim: 1024
    video_input_dim: 768
  training:
    best_checkpoint_path: outputs/meld_sequence_dialogue_rnn_best.pt
    max_epochs: 8
    batch_size: 4
    device: cpu

media:
  on_error: drop_sample
  audio_sample_rate: 16000
  video_max_frames: 16
  video_frame_size: [224, 224]

evaluation:
  metrics: [accuracy, macro_f1, weighted_f1]
  confusion: true
  scenarios: [full, no_text, no_audio, no_video]

reporters: []

