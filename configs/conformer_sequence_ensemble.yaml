name: conformer_sequence_ensemble

dataset:
  type: synthetic
  n_train: 24
  n_dev: 0
  n_test: 12

extractors:
  - type: text_token_embeddings
    output_dim: 32
    max_tokens: 8
  - type: audio_wav2vec2_xlsr_sequence
    output_dim: 24
    max_steps: 8
  - type: video_frame_embeddings
    output_dim: 16
    num_frames: 4

model:
  type: ensemble
  base:
    type: dialogue_rnn
    modality_encoder:
      encoder_type: conformer
      text_input_dim: 32
      audio_input_dim: 24
      video_input_dim: 16
      proj_dim: 16
      hidden_dim: 16
    fusion:
      modality_dim: 16
      fusion_dim: 32
    dialogue_context:
      hidden_dim: 32
    memory_attention:
      hidden_dim: 32
      attn_dim: 32
    classifier:
      hidden_dim: 32
    training:
      max_epochs: 1
      batch_size: 2
      device: cpu
  ensemble:
    mode: late_logits
    alpha: 1.0
    beta: 0.5
    gamma: 0.5

reporters: []

