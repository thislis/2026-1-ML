# SVM margin gate + existing dialogue_rnn Stage 2.
#   uv sync --extra text --extra deep
#   uv run meld-emotion run --config configs/two_stage_svm_dialogue_rnn.yaml
name: two_stage_svm_dialogue_rnn
seed: 0
output_dir: outputs

dataset:
  type: synthetic
  n_train: 80
  n_dev: 20
  n_test: 24
  seed: 0
  with_audio: true
  with_video: true

extractors:
  - type: text_concepts
  - type: text_bow
    n_features: 64
  - type: audio_concepts
  - type: video_concepts

model:
  type: two_stage_svm_margin
  margin_threshold: 0.25
  stage1_confidence_threshold: null  # 예: 0.65 로 설정하면 낮은 SVM confidence 샘플을 Stage 2 로 보냄
  stage1_use_concepts: true
  neutral_label: neutral
  stage1:
    type: svm
    C: 1.0
    kernel: rbf
  stage2:
    type: dialogue_rnn
    rnn_type: gru
    modality_encoder:
      proj_dim: 64
      hidden_dim: 64
      dropout: 0.1
    fusion:
      modality_dim: 64
      fusion_dim: 128
      dropout: 0.1
      use_gated_fusion: true
      use_interaction_features: true
    dialogue_context:
      speaker_emb_dim: 16
      hidden_dim: 128
      num_layers: 1
      dropout: 0.1
    memory_attention:
      enabled: true
      use_memory: true
      hidden_dim: 128
      attn_dim: 128
      use_rope: false
      use_relative_distance_bias: true
      use_same_speaker_bias: true
    classifier:
      hidden_dim: 128
      dropout: 0.1
    training:
      lr: 0.0002
      weight_decay: 0.01
      gradient_clip_norm: 1.0
      batch_size: 4
      max_epochs: 1
      early_stopping_patience: 1
      validation_fraction: 0.0
      modality_dropout: 0.0
      seed: 0
      device: cpu

evaluation:
  metrics: [accuracy, macro_f1, weighted_f1]
  confusion: true
  scenarios: [full, no_text, no_audio, no_video]

cache:
  type: memory

reporters:
  - type: console
  - type: json
    path: outputs/two_stage_svm_dialogue_rnn_result.json
